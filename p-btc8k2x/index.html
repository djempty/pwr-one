<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pwr.one</title>
<style>html,body{margin:0;overflow:hidden;background:#050505}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script id="vs" type="x-shader/x-vertex">uniform float t; uniform float px;
attribute vec3 scatterDir;
attribute float seed, atomIdx, orbitAngle, orbitR, tN, strandSign, isRung, partRole;
varying float vA; varying vec3 vC;
float e(float x){return x*x*(3.-2.*x);}
float win(float a,float b,float x){return e(clamp((x-a)/(b-a),0.,1.));}
float h(float n){return fract(sin(n*127.1)*43758.5453);}
mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,-s,0.,s,c);}
vec3 flow(vec3 p,float t){
  return vec3(sin(p.y*.7+t*.9)+sin(p.z*1.3+t*.6)+.5*sin(p.x*2.1-t*.4),
              sin(p.z*.8+t*.7)+sin(p.x*1.1+t*.5)+.5*sin(p.y*1.9+t*.3),
              sin(p.x*.6+t*.8)+sin(p.y*1.2+t*.4)+.5*sin(p.z*2.3-t*.5))*.5;
}
void main(){
  float x=mod(t,47.);
  vec3 btc=vec3(.969,.576,.102), amber=vec3(1.,.78,.35), hot=vec3(1.,.95,.85), dim=vec3(.6,.33,.08), cool=vec3(1.,.88,.62);

  vec3 cloud=position;

  // --- DNA double helix, thin/delicate (matches reference), VERY slow self-rotation ---
  const float TURNS=4.5, HR=2.2, HH=18.0;
  float ang = tN*TURNS*6.28318 + strandSign*3.14159;
  float hx = cos(ang)*HR, hz = sin(ang)*HR, hy = (tN-0.5)*HH;
  vec3 ownStrand = vec3(hx,hy,hz);
  float angOpp = ang + 3.14159;
  vec3 oppStrand = vec3(cos(angOpp)*HR, hy, sin(angOpp)*HR);
  float rungFrac = 0.15 + 0.7*fract(seed*7.0);
  vec3 rungPos = mix(ownStrand, oppStrand, rungFrac);
  vec3 thickOff = normalize(vec3(hx,0.,hz)) * (h(seed*9.1)-0.5)*0.12;
  vec3 backbonePos = ownStrand + thickOff;
  vec3 helixRigid = mix(backbonePos, rungPos, isRung);
  helixRigid = rotY(t*0.045) * helixRigid;   // VERY slow rotation (~140s/turn), not Polarity's icon rate

  // --- single atom: nucleus core + proton ring + electron ring, all 8000 pts split 3 ways via partRole ---
  vec3 nucleusPos = normalize(vec3(h(seed)-.5,h(seed*2.1)-.5,h(seed*3.7)-.5)) * (0.25*pow(fract(seed*13.0),0.33));
  float pAng = orbitAngle + t*0.35;
  vec3 protonPos = rotX(0.5) * vec3(cos(pAng), 0., sin(pAng)) * (1.3+orbitR*0.3);
  float eAng = orbitAngle*1.3 + t*0.9 + 1.7;
  vec3 electronPos = rotX(-0.35) * vec3(cos(eAng), sin(eAng*0.4), sin(eAng)) * (2.1+orbitR*0.4);
  vec3 atomSingle = nucleusPos;
  atomSingle = mix(atomSingle, protonPos, step(0.5,partRole)*step(partRole,1.5));
  atomSingle = mix(atomSingle, electronPos, step(1.5,partRole));

  vec3 burstH = helixRigid + scatterDir*(3.0+h(seed*5.)*5.0);
  vec3 flockH = burstH*.75 + flow(burstH*.22, t*.7)*3.0; flockH.y*=.78;
  vec3 burstA = atomSingle*2.5 + scatterDir*(3.0+h(seed*6.)*5.0);
  vec3 flockA = burstA*.7 + flow(burstA*.22, t*.65+9.0)*3.0; flockA.y*=.78;

  vec3 p = cloud;
  p = mix(p, helixRigid, win(2.,5.,x));
  p = mix(p, burstH,     win(18.,21.,x));
  p = mix(p, flockH,     win(20.,24.,x));
  p = mix(p, atomSingle, win(24.,27.,x));
  p = mix(p, burstA,     win(31.,34.,x));
  p = mix(p, flockA,     win(33.,40.,x));
  p = mix(p, cloud,      win(45.,47.,x));

  float sw=sin(t*.618+seed*6.283)*.03; p+=vec3(sw,sw*.618,-sw);

  vec3 col=btc;
  col=mix(col, amber, isRung*.6*win(2.,5.,x));
  col=mix(col, hot, win(2.,5.,x)*.3);
  col=mix(col, cool, step(1.5,partRole)*win(24.,27.,x));
  col=mix(col, amber, step(0.5,partRole)*step(partRole,1.5)*win(24.,27.,x));
  col=mix(col, hot, step(partRole,0.5)*win(24.,27.,x)*.5);
  vC=col;

  vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;
  gl_PointSize=(1.1+seed*2.1)*px*(12./max(-mv.z,.5)); vA=.35+.65*seed;
}</script>
<script id="fs" type="x-shader/x-fragment">varying float vA; varying vec3 vC;
void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;gl_FragColor=vec4(vC,pow(1.-d*2.,1.618)*vA);}</script>
<script type="module">import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
const L=47.0;
const ATOMS=200, PPA=40, N=ATOMS*PPA;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050505,0.018);
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,200);cam.position.set(0,0,16);

const POS=new Float32Array(N*3), SCAT=new Float32Array(N*3);
const SEED=new Float32Array(N), ATIDX=new Float32Array(N);
const OANG=new Float32Array(N), ORAD=new Float32Array(N);
const TN=new Float32Array(N), STRAND=new Float32Array(N), ISRUNG=new Float32Array(N), PART=new Float32Array(N);

let pi=0;
for(let a=0;a<ATOMS;a++){
  const strand = a%2===0 ? 0 : 1;
  const tN = a/ATOMS;
  for(let k=0;k<PPA;k++){
    const i=pi++;
    const r=6+Math.random()*9, tth=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    POS.set([r*Math.sin(ph)*Math.cos(tth), r*Math.sin(ph)*Math.sin(tth)*0.6, r*Math.cos(ph)], i*3);
    const dir = new THREE.Vector3(Math.random()-.5, Math.random()-.5, Math.random()-.5).normalize();
    SCAT.set([dir.x,dir.y,dir.z], i*3);
    SEED[i]=Math.random();
    ATIDX[i]=a;
    OANG[i]=Math.random()*Math.PI*2;
    ORAD[i]=Math.random();
    TN[i]=tN; STRAND[i]=strand;
    ISRUNG[i] = (k>=6 && k<23) ? 1.0 : 0.0;
    // single-atom partition across the WHOLE 8000 points, independent of the helix grouping above:
    // ~35% nucleus, ~32% proton ring, ~33% electron ring
    const frac=(i/N);
    PART[i] = frac<0.35?0 : frac<0.67?1 : 2;
  }
}

const g=new THREE.BufferGeometry();
g.setAttribute('position',new THREE.BufferAttribute(POS,3));
g.setAttribute('scatterDir',new THREE.BufferAttribute(SCAT,3));
g.setAttribute('seed',new THREE.BufferAttribute(SEED,1));
g.setAttribute('atomIdx',new THREE.BufferAttribute(ATIDX,1));
g.setAttribute('orbitAngle',new THREE.BufferAttribute(OANG,1));
g.setAttribute('orbitR',new THREE.BufferAttribute(ORAD,1));
g.setAttribute('tN',new THREE.BufferAttribute(TN,1));
g.setAttribute('strandSign',new THREE.BufferAttribute(STRAND,1));
g.setAttribute('isRung',new THREE.BufferAttribute(ISRUNG,1));
g.setAttribute('partRole',new THREE.BufferAttribute(PART,1));

const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{t:{value:0},px:{value:renderer.getPixelRatio()}},
 vertexShader:document.getElementById('vs').textContent,fragmentShader:document.getElementById('fs').textContent});
scene.add(new THREE.Points(g,mat));

const dg=new THREE.BufferGeometry(),dp=new Float32Array(4500);for(let i=0;i<dp.length;i++)dp[i]=(Math.random()-.5)*70;
dg.setAttribute('position',new THREE.BufferAttribute(dp,3));
scene.add(new THREE.Points(dg,new THREE.PointsMaterial({color:0x3a2510,size:0.03,transparent:true,opacity:0.2})));

const comp=new EffectComposer(renderer);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.95,0.618,0.0));
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);});
const ease=x=>x*x*(3-2*x), win=(a,b,x)=>ease(Math.min(1,Math.max(0,(x-a)/(b-a))));
const clock=new THREE.Clock();
function frame(){
  const t=reduce?10:clock.getElapsedTime(), x=t%L;
  mat.uniforms.t.value=t;

  // camera: during the DNA hold (2-18s) slowly RECEDE straight back (no orbiting) so the whole structure
  // reads as a single rigid object drifting away into space, exactly as asked. During the atom phase
  // (24-31s) push in close so a single atom reads clearly.
  const dnaHold = win(5,18,x)*(1-win(18,21,x));
  const atomHold = win(24,27,x)*(1-win(31,34,x));
  let camZ = 16;
  camZ += dnaHold*10.0;      // 16 -> 26, slow recede, feels like floating into the distance
  camZ -= atomHold*11.5;     // pulls in close for the single atom (16 -> 4.5)
  const camX = mx*1.2, camY = -my*0.8;
  cam.position.x += (camX-cam.position.x)*0.04;
  cam.position.y += (camY-cam.position.y)*0.04;
  cam.position.z += (camZ-cam.position.z)*0.025;
  cam.lookAt(0,0,0);
  comp.render(); if(!reduce) requestAnimationFrame(frame);
}
frame();</script>
</body></html>
