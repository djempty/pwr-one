<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polarity</title><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<style>html,body{margin:0;height:100%;background:#070d1a;overflow:hidden}canvas{display:block}
.mk{position:fixed;left:34px;top:30px;font-family:Georgia,serif;letter-spacing:.382em;color:#f8f4ef;font-size:14px;opacity:.85;z-index:2}
.mk svg{width:22px;height:22px;vertical-align:middle;margin-right:13px}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<div class="mk"><svg viewBox="0 0 100 100"><path d="M59.44 11.13 A40 40 0 1 0 59.44 88.87 Z" fill="#f8f4ef" transform="translate(-3.5,-5.84)"/><path d="M59.44 11.13 A40 40 0 0 1 59.44 88.87 Z" fill="#b08d4f" transform="translate(3.5,5.84)"/></svg>POLARITY</div>
<script id="vs" type="x-shader/x-vertex">
 uniform float t,px,zs; attribute vec3 pB,loc,gc; attribute float seed,side,grp,gs,gsz;
 varying float vA; varying vec3 vC;
 float e(float x){return x*x*(3.-2.*x);}
 float win(float a,float b,float x){return e(clamp((x-a)/(b-a),0.,1.));}
 mat3 rotY(float a){float c=cos(a),s=sin(a);return mat3(c,0.,-s,0.,1.,0.,s,0.,c);}
 mat3 rotX(float a){float c=cos(a),s=sin(a);return mat3(1.,0.,0.,0.,c,s,0.,-s,c);}
 vec3 flow(vec3 p,float t){
   return vec3(sin(p.y*.7+t*.9)+sin(p.z*1.3+t*.6)+.5*sin(p.x*2.1-t*.4),
               sin(p.z*.8+t*.7)+sin(p.x*1.1+t*.5)+.5*sin(p.y*1.9+t*.3),
               sin(p.x*.6+t*.8)+sin(p.y*1.2+t*.4)+.5*sin(p.z*2.3-t*.5))*.5;
 }
 void main(){
  float x=mod(t,34.);
  vec3 cool=mix(vec3(.973,.957,.937),vec3(.45,.58,.85),.35), ivory=vec3(.95,.94,.92), gold=vec3(.88,.70,.38);
  // each globe: own tilt, own spin, like a planet
  vec3 icon=gc+rotX(.35+gs*1.2)*rotY(t*(.18+gs*.3)+gs*6.283)*loc*2.5*gsz;
  vec3 p; float a=1.;
  if(grp>.5){
    p=position; p=mix(p,pB,win(2.,5.,x)); p=mix(p,icon,win(5.5,8.5,x));
    p*=zs;
  } else {
    p=icon*zs;
    a=win(12.5,18.,x)*(1.-win(28.,32.5,x));
  }
  float mur=win(19.,25.,x)*(1.-win(29.,33.,x));
  p+=flow(gc*.004+seed*.15+p*.05,t*.55)*mur*1.6;
  if(grp>.5) p=mix(p,position,win(27.,33.,x));
  float sw=sin(t*.618+seed*6.283)*.05; p+=vec3(sw,sw*.618,-sw);
  vec3 col=cool; col=mix(col,ivory,win(2.,5.,x)*.5*grp);
  col=mix(col,side>.5?gold:ivory,grp>.5?win(5.,8.5,x):1.);
  col=mix(col,cool,win(23.,31.,x)); vC=col;
  vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;
  gl_PointSize=(1.1+seed*2.3)*px*(12./max(-mv.z,.5))*mix(1.,.7,1.-zs)*(grp>.5?1.:.85);
  vA=(.35+.65*seed)*a;
 }
</script>
<script id="fs" type="x-shader/x-fragment">
 varying float vA; varying vec3 vC;
 void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;gl_FragColor=vec4(vC,pow(1.-d*2.,1.618)*vA);}
</script>
<script id="svs" type="x-shader/x-vertex">
 uniform float px; attribute float sz; varying float vB;
 void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_Position=projectionMatrix*mv;gl_PointSize=sz*px;vB=.25+sz*.12;}
</script>
<script id="sfs" type="x-shader/x-fragment">
 varying float vB; void main(){vec2 c=gl_PointCoord-.5;float d=length(c);if(d>.5)discard;gl_FragColor=vec4(vec3(.85,.86,.92),pow(1.-d*2.,2.)*vB);}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
/* STORY, 34 s seamless loop
   0-3   scattered points of light            3-6  they gather into one sphere
   6-12  the split globe turns slowly, distant stars of varied size behind it
   12-28 the camera pulls back, accelerating: other split globes appear, a galaxy of them,
         each its own size and tilt, each turning; with distance they become only points of light
   19-31 the galaxy drifts as one, a slow murmuration
   27-34 it becomes the same scattered points of light we began with */
const PHI=(1+Math.sqrt(5))/2, GA=Math.PI*(3-Math.sqrt(5)), L=34;
const HERO=7000, NG=640, PER=44, N=HERO+NG*PER;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x070d1a,0.012);
const cam=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,400);cam.position.set(0,0,13);
const cut=-1+2/PHI, off=1/Math.pow(PHI,4);
function splitPoint(){
  const u=Math.random()*2*Math.PI,v=Math.acos(2*Math.random()-1),sh=Math.random()<0.8?1-Math.random()*0.04:Math.cbrt(Math.random());
  let x=sh*Math.sin(v)*Math.cos(u),y=sh*Math.sin(v)*Math.sin(u),z=sh*Math.cos(v);
  if(Math.random()<0.18){x=cut+(Math.random()-.5)*0.01;const q=Math.sqrt(1-cut*cut)*Math.sqrt(Math.random()),w=Math.random()*2*Math.PI;y=q*Math.cos(w);z=q*Math.sin(w);}
  const r=x>cut;return [x+(r?off*.6:-off*.6),y+(r?-off:off),z,r?1:0];
}
// galaxy: golden spiral arms, tilted disc, density falling outward
const centres=[],tilt=new THREE.Euler(-1.05,0,0.3),v=new THREE.Vector3();
for(let j=0;j<NG;j++){
  let c;
  for(;;){
    const r=9+Math.pow(Math.random(),0.7)*230, arm=j%3, th=Math.log(r/9)*2.2+arm*2.094+(Math.random()-.5)*0.9;
    v.set(Math.cos(th)*r,(Math.random()-.5)*(10+r*0.08),Math.sin(th)*r).applyEuler(tilt);
    if(v.z<9&&!(Math.hypot(v.x,v.y)<7&&v.z>-6)){c=[v.x,v.y,v.z];break;}
  }
  centres.push(c);
}
const A=new Float32Array(N*3),B=new Float32Array(N*3),LOC=new Float32Array(N*3),GC=new Float32Array(N*3),
      S=new Float32Array(N),SD=new Float32Array(N),GR=new Float32Array(N),GS=new Float32Array(N),GZ=new Float32Array(N);
for(let i=0;i<N;i++){
  const r=6+Math.random()*8,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
  A.set([r*Math.sin(p)*Math.cos(t),r*Math.sin(p)*Math.sin(t)*0.6,r*Math.cos(p)],i*3);
  const sp=splitPoint(); LOC.set(sp.slice(0,3),i*3); SD[i]=sp[3]; S[i]=Math.random();
  if(i<HERO){
    const y=1-(i/(HERO-1))*2,rr=Math.sqrt(1-y*y),th=GA*i;
    B.set([Math.cos(th)*rr*3.2,y*3.2,Math.sin(th)*rr*3.2],i*3);
    GR[i]=1; GS[i]=0; GZ[i]=1;
  } else {
    const j=Math.floor((i-HERO)/PER); GC.set(centres[j],i*3); GR[i]=0;
    GS[i]=(j*0.6180339887)%1; GZ[i]=0.55+((j*0.381966)%1)*0.75;
  }
}
const g=new THREE.BufferGeometry();
for(const [k,a,n] of [['position',A,3],['pB',B,3],['loc',LOC,3],['gc',GC,3],['seed',S,1],['side',SD,1],['grp',GR,1],['gs',GS,1],['gsz',GZ,1]])
  g.setAttribute(k,new THREE.BufferAttribute(a,n));
const mat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
 uniforms:{t:{value:0},px:{value:renderer.getPixelRatio()},zs:{value:1}},
 vertexShader:document.getElementById('vs').textContent,fragmentShader:document.getElementById('fs').textContent});
const pts=new THREE.Points(g,mat);pts.frustumCulled=false;scene.add(pts);
// distant stars of varied size
const SN=900,sp=new Float32Array(SN*3),ss=new Float32Array(SN);
for(let i=0;i<SN;i++){const d=new THREE.Vector3().randomDirection().multiplyScalar(80+Math.random()*120);if(d.z>0)d.z*=-1;sp.set([d.x,d.y,d.z],i*3);ss[i]=Math.pow(Math.random(),3)*4.5+0.6;}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));sg.setAttribute('sz',new THREE.BufferAttribute(ss,1));
scene.add(new THREE.Points(sg,new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false,
 uniforms:{px:{value:renderer.getPixelRatio()}},vertexShader:document.getElementById('svs').textContent,fragmentShader:document.getElementById('sfs').textContent})));
const comp=new EffectComposer(renderer);comp.addPass(new RenderPass(scene,cam));
comp.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.618,0.0));
let mx=0,my=0;addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;});
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);comp.setSize(innerWidth,innerHeight);});
const clock=new THREE.Clock();
function frame(){
  const t=reduce?10:clock.getElapsedTime(), x=t%L;
  // pull-back: the world shrinks around the lens, slow then accelerating (cubic)
  const u=Math.min(1,Math.max(0,(x-12)/16)), zs=Math.pow(0.025,u*u*u*0.6+u*u*0.4);
  mat.uniforms.t.value=t; mat.uniforms.zs.value=zs;
  scene.fog.density=0.012*Math.min(8,1/Math.max(zs,0.125))*0+0.012;
  cam.position.x+=(mx*2-cam.position.x)*0.03; cam.position.y+=(-my*1.2-cam.position.y)*0.03;
  cam.lookAt(0,0,0);
  comp.render(); if(!reduce) requestAnimationFrame(frame);
}
frame();
</script></body></html>
