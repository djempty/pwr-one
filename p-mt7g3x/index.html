<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>MIKE TELFORD | VANCOUVER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#999;font:13px/1.4 "courier new",monospace}
a{color:#708090;text-decoration:none}a:hover{text-decoration:underline}
#container{max-width:1000px;margin:0 auto;padding:10px 5px}
#top{margin:0 5px 10px;display:flex;flex-wrap:wrap;gap:4px 0;line-height:20px}
#top h2{display:inline;font-size:13px;margin:0;font-weight:normal}
#grid{position:relative}
.post{position:absolute;width:240px;border:1px solid #f1f1f1;background:#fff;overflow:hidden;opacity:0;transition:opacity .4s}
.post.in{opacity:1}
.post img{display:block;width:100%;height:auto;cursor:zoom-in}
.meta{padding:5px;color:#708090;font-size:11px;position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);opacity:0;transition:opacity .2s}
.post:hover .meta{opacity:1}
#more{text-align:center;padding:30px;color:#708090}
#lb{position:fixed;inset:0;background:rgba(255,255,255,.97);display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column}
#lb.open{display:flex}
#lb img{max-width:96vw;max-height:88vh;object-fit:contain}
#lb .cap{margin-top:8px;max-width:90vw;text-align:center;font-size:12px;color:#708090}
#lb button{position:absolute;background:none;border:0;font:28px "courier new",monospace;color:#708090;cursor:pointer;padding:14px}
#lb .x{top:0;right:0}#lb .p{left:0;top:45%}#lb .n{right:0;top:45%}
@media(max-width:560px){.post{width:calc(50% - 6px)}}
</style></head><body>
<div id="container">
<div id="top"><h2><a href="./">MIKE TELFORD | VANCOUVER</a></h2>&nbsp;//&nbsp;<span>I Am That</span>&nbsp;//&nbsp;<a href="./">Archive</a>&nbsp;/&nbsp;<a href="https://ca.linkedin.com/in/miketelford">LinkedIn</a></div>
<div id="grid"></div><div id="more"></div></div>
<div id="lb"><button class="x" aria-label="Close">×</button><button class="p" aria-label="Previous">‹</button><button class="n" aria-label="Next">›</button><img alt=""><div class="cap"></div></div>
<script>
fetch('manifest.json').then(r=>r.json()).then(M=>{
const grid=document.getElementById('grid'),more=document.getElementById('more');
const G=6,BATCH=60;let cols,colW,heights,shown=0,mobile;
function layout(){mobile=innerWidth<=560;const W=grid.clientWidth;
 if(mobile){cols=2;colW=(W-G)/2-0}else{colW=240+2;cols=Math.max(1,Math.floor((W+G)/(colW+G)))}
 heights=new Array(cols).fill(0);
 [...grid.children].forEach(place);}
function place(el){let c=0;for(let k=1;k<cols;k++)if(heights[k]<heights[c])c=k;
 const w=mobile?colW:240+2;el.style.width=(mobile?colW:242)+'px';
 const x=mobile?c*(colW+G):c*(242+G)+(grid.clientWidth-(cols*242+(cols-1)*G))/2;
 const e=el._e;const h=(mobile?colW-2:240)*e.h/e.w+2;
 el.style.left=x+'px';el.style.top=heights[c]+'px';heights[c]+=h+G;grid.style.height=Math.max(...heights)+'px'}
function add(){const end=Math.min(shown+BATCH,M.length);
 for(;shown<end;shown++){const e=M[shown],d=document.createElement('div');d.className='post';d._e=e;d._i=shown;
  const dt=new Date(e.d*1000).toISOString().slice(0,10);
  d.innerHTML='<img loading="lazy" decoding="async" src="thumb/'+e.t+'" width="'+e.w+'" height="'+e.h+'" alt="'+(e.c||'').replace(/"/g,'&quot;')+'"><div class="meta"><a href="'+e.u+'" onclick="return false">'+dt+'</a></div>';
  grid.appendChild(d);place(d);requestAnimationFrame(()=>d.classList.add('in'))}
 more.textContent=shown<M.length?'':M.length+' images';}
const io=new IntersectionObserver(es=>{if(es[0].isIntersecting&&shown<M.length)add()},{rootMargin:'1500px'});
layout();add();io.observe(more);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,150)});
// lightbox
const lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.cap');let cur=0;
function show(i){cur=(i+M.length)%M.length;const e=M[cur];li.src='img/'+e.i;lc.textContent=e.c||'';lb.classList.add('open')}
grid.addEventListener('click',ev=>{const p=ev.target.closest('.post');if(p&&ev.target.tagName==='IMG')show(p._i)});
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');
lb.querySelector('.p').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector('.n').onclick=e=>{e.stopPropagation();show(cur+1)};
lb.addEventListener('click',e=>{if(e.target===lb||e.target===li)lb.classList.remove('open')});
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
});
</script></body></html>
