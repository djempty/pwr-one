<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Droplet</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#l{position:fixed;left:14px;bottom:12px;font:11px/1 system-ui,sans-serif;letter-spacing:.12em;color:rgba(160,190,210,.28);pointer-events:none;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="l">droplet</div>
<script id="vs" type="x-shader/x-vertex">#version 300 es
in vec2 p;void main(){gl_Position=vec4(p,0.,1.);}
</script>
<script id="fs" type="x-shader/x-fragment">#version 300 es
precision highp float;
out vec4 o;
uniform vec2 uRes;
uniform vec3 uC;
uniform float uR;
uniform float uA[8];
uniform vec3 uR0,uR1,uR2;
uniform float uT;
const float FL=0.75, CAMZ=4.0;
const vec3 LK=vec3(-0.52,0.62,0.59);   // key light dir (towards light)
const vec3 LF=vec3(0.75,-0.25,0.61);   // fill dir

float h13(vec3 p){p=fract(p*.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
vec3 h33(vec3 p){p=fract(p*vec3(.1031,.1030,.0973));p+=dot(p,p.yxz+33.33);return fract((p.xxy+p.yxx)*p.zyx);}
float vn(vec3 p){vec3 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
 return mix(mix(mix(h13(i),h13(i+vec3(1,0,0)),f.x),mix(h13(i+vec3(0,1,0)),h13(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(h13(i+vec3(0,0,1)),h13(i+vec3(1,0,1)),f.x),mix(h13(i+vec3(0,1,1)),h13(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm(vec3 p){float a=.5,s=0.;for(int i=0;i<3;i++){s+=a*vn(p);p=p*2.03+7.1;a*=.5;}return s;}

float stars(vec3 d,float sc,float thr,float rad){
 vec3 p=d*sc,c=floor(p);
 float r=h13(c);
 if(r<thr)return 0.;
 vec3 pos=c+.2+.6*h33(c+3.7);
 float dd=length(p-pos);
 float b=smoothstep(rad,0.,dd);
 return b*b*(.4+1.6*fract(r*37.));
}

float box(vec3 d,vec3 c,vec3 u,vec3 v,vec2 hs,float soft){
 float z=dot(d,c); if(z<.05)return 0.;
 vec2 q=vec2(dot(d,u),dot(d,v))/z;
 vec2 e=hs-abs(q);
 return smoothstep(0.,soft,e.x)*smoothstep(0.,soft,e.y);
}
vec3 env(vec3 d){
 vec3 col=vec3(.005,.009,.022)+vec3(.008,.015,.03)*smoothstep(-.6,.8,d.y);
 // large soft nebula band (blue-white), bright core so lensing reads
 vec3 nb=normalize(vec3(.35,.78,.52));
 float bd=dot(d,nb);
 float fb=fbm(d*2.2+4.)*.8+.35;
 float band=exp(-bd*bd*14.)*fb;
 col+=band*(vec3(.25,.42,.9)*.5+vec3(.8,.9,1.)*.7*exp(-bd*bd*60.));
 col+=smoothstep(.5,.85,fbm(d*3.1+9.))*vec3(.25,.1,.4)*.25*exp(-bd*bd*3.);
 // distant planet with sunlit limb
 vec3 pc=normalize(vec3(-.42,-.5,-.76));float cr=.90,sr=sqrt(1.-cr*cr);
 float c=dot(d,pc);
 if(c>cr){
  vec3 t=d-pc*c;float s=min(length(t)/sr,1.);
  vec3 n=normalize(pc*sqrt(1.-s*s)+t/max(length(t),1e-4)*s);
  vec3 sun=normalize(vec3(.75,.6,-.2));
  float lit=smoothstep(-.15,.7,dot(n,sun));
  vec3 base=mix(vec3(.03,.05,.1),vec3(.4,.6,.95),lit);
  base*=.65+.35*fbm(n*5.);
  float atm=pow(s,5.)*(.3+.9*lit);
  float edge=smoothstep(cr,cr+.012,c);
  col=mix(col+vec3(.25,.5,.95)*.5,base*1.3+vec3(.35,.7,1.)*atm*1.4,edge);
 } else {
  float g=exp(-(cr-c)*60.);
  col+=vec3(.25,.5,.95)*g*.5;
 }
 if(c>cr)col+=vec3(.25,.5,.95)*.5*smoothstep(cr,cr+.012,c)*0.;
 // sun glare behind
 vec3 sd=normalize(vec3(.75,.6,-.2));float sk=max(dot(d,sd),0.);
 col+=vec3(1.,.95,.85)*(smoothstep(.9985,.9992,sk)*40.+pow(sk,60.)*.5+pow(sk,4.)*.3);
 // stars
 float st=stars(d,38.,.5,.1)+stars(d,70.,.5,.12)*.8+stars(d,16.,.75,.08)*3.+stars(d,9.,.8,.09)*4.;
 col+=st*mix(vec3(.75,.85,1.),vec3(1.,.88,.7),h13(floor(d*38.)))*1.2;
 // softboxes (front hemisphere, mostly seen in reflection)
 vec3 kc=normalize(LK);vec3 ku=normalize(cross(vec3(0,1,0),kc));vec3 kv=cross(kc,ku);
 col+=vec3(1.,.97,.92)*box(d,kc,ku,kv,vec2(.42,.3),.3)*9.;
 col+=vec3(1.,.97,.92)*pow(max(dot(d,kc),0.),30.)*.35;
 vec3 fc=normalize(LF);vec3 fu=normalize(cross(vec3(0,1,0),fc));vec3 fv=cross(fc,fu);
 col+=vec3(.55,.72,1.)*box(d,fc,fu,fv,vec2(.15,.8),.1)*3.2;
 vec3 tc=normalize(vec3(.1,-.8,.55));vec3 tu=normalize(cross(vec3(0,0,1),tc));vec3 tv=cross(tc,tu);
 col+=vec3(.6,.7,.9)*box(d,tc,tu,tv,vec2(.9,.12),.1)*1.2;
 return col;
}

float Y(int i,vec3 q){
 float x=q.x,y=q.y,z=q.z,z2=z*z;
 if(i==0)return (3.*z2-1.)*.5;
 if(i==1)return x*z*2.;
 if(i==2)return x*x-y*y;
 if(i==3)return x*y*2.;
 if(i==4)return y*z*2.;
 if(i==5)return z*(5.*z2-3.)*.5;
 if(i==6)return x*(5.*z2-1.)*.8;
 return y*(5.*z2-1.)*.8;
}
float sdf(vec3 p){
 vec3 v=p-uC;
 float l=length(v);
 vec3 q=v/max(l,1e-4);
 q=vec3(dot(uR0,q),dot(uR1,q),dot(uR2,q));
 float d=0.;
 for(int i=0;i<8;i++)d+=uA[i]*Y(i,q);
 return (l-uR*(1.+.11*d))*.8;
}
vec3 nrm(vec3 p){
 const vec2 k=vec2(1,-1);const float e=.0015;
 return normalize(k.xyy*sdf(p+k.xyy*e)+k.yyx*sdf(p+k.yyx*e)+k.yxy*sdf(p+k.yxy*e)+k.xxx*sdf(p+k.xxx*e));
}

// travel inside the drop; returns exit direction, w = path length (with TIR bounces)
vec4 inside(vec3 pos,vec3 dir,float ior){
 float L=0.;
 for(int b=0;b<3;b++){
  float t=.03;
  for(int i=0;i<40;i++){
   float h=-sdf(pos+dir*t);
   if(h<.0006)break;
   t+=max(h*.95,.004);
   if(t>3.)break;
  }
  vec3 pe=pos+dir*t;L+=t;
  vec3 N=nrm(pe);
  vec3 r=refract(dir,-N,ior);
  if(dot(r,r)>.01){
   // weak internal Fresnel loss ignored; exit
   return vec4(normalize(r),L);
  }
  dir=reflect(dir,-N);pos=pe-N*.012;
 }
 return vec4(dir,L);
}

vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

void main(){
 vec2 uv=(gl_FragCoord.xy-.5*uRes)/min(uRes.x,uRes.y);
 vec3 ro=vec3(0.,0.,CAMZ);
 vec3 rd=normalize(vec3(uv,-FL));
 float pw=1.6*(CAMZ/FL)/min(uRes.x,uRes.y);
 vec3 bg=env(rd);
 vec3 oc=ro-uC;float bR=uR*1.3;
 float b=dot(oc,rd),c=dot(oc,oc)-bR*bR,disc=b*b-c;
 bool hit=false;vec3 p=ro;float hm=1e3;vec3 pm=ro;
 if(disc>0.){
  float t=-b-sqrt(disc),tm=t+2.*sqrt(disc);
  for(int i=0;i<72;i++){
   float h=sdf(ro+rd*t);
   if(h<hm){hm=h;pm=ro+rd*t;}
   if(h<.0006){hit=true;break;}
   t+=h;
   if(t>tm)break;
  }
  p=ro+rd*t;
 }
 float cov=hit?1.:clamp(1.-hm/pw,0.,1.);
 vec3 col=bg;
 if(cov>0.){
  if(!hit)p=pm;
  vec3 n=nrm(p);
  float cosi=clamp(dot(-rd,n),0.,1.);
  float rim=1.-cosi;
  float F=.02+.98*pow(rim,4.);
  vec3 rr=reflect(rd,n);
  vec3 refl=env(rr);
  // dispersion only near grazing
  float disp=.0012*rim*rim;
  vec3 iors=vec3(1.3330-disp,1.3330,1.3330+disp);
  vec3 tr;float pl=0.;
  for(int ch=0;ch<3;ch++){
   float ior=iors[ch];
   vec3 d0=refract(rd,n,1./ior);
   vec4 r=inside(p-n*.012,d0,ior);
   if(ch==1)pl=r.w;
   vec3 ab=vec3(.55,.14,.05);
   tr[ch]=env(r.xyz)[ch]*exp(-r.w*ab[ch]*.22);
  }
  float thick=clamp(pl/(2.*uR),0.,1.);
  // far-side caustic crescent opposite key light
  vec2 ld=normalize(-LK.xy);
  float sx=length(n.xy);
  float al=max(dot(n.xy/max(sx,1e-3),ld),0.);
  float cau=pow(al,3.)*exp(-pow((sx-.72)/.16,2.));
  tr+=vec3(1.,.95,.85)*cau*.55*(1.-F);
  // slight cyan in thick paths
  tr*=mix(vec3(1.),vec3(.88,.98,1.04),thick*.6);
  // bubbles: drifting micro-droplets seen through the body
  float bub=0.;vec3 bcol=vec3(0.);
  for(int i=0;i<4;i++){
   float fi=float(i);
   vec3 q=vec3(sin(uT*.21+fi*2.3),cos(uT*.17+fi*1.7),sin(uT*.13+fi*3.1))*(.18+.1*fi);
   q=vec3(dot(vec3(uR0.x,uR1.x,uR2.x),q),dot(vec3(uR0.y,uR1.y,uR2.y),q),dot(vec3(uR0.z,uR1.z,uR2.z),q))*uR;
   vec3 bp=uC+q;
   vec2 bs=(bp.xy/(CAMZ-bp.z))*FL;
   float rr2=(.02+.012*fract(fi*.37))*uR*FL/(CAMZ-bp.z);
   float dd=length(uv-bs)/rr2;
   if(dd<1.2){
    float ring=smoothstep(.65,.97,dd)*(1.-smoothstep(.97,1.12,dd));
    vec2 hl=(uv-bs)/rr2-vec2(-.3,.35);
    float sp=smoothstep(.3,.0,length(hl));
    bub+=ring*.18+sp*.5;
    tr*=1.-.15*(1.-smoothstep(.2,1.,dd))*step(dd,1.);
   }
  }
  tr+=vec3(.8,.9,1.)*bub*.5;
  vec3 spec=vec3(1.,.97,.92)*pow(max(dot(rr,normalize(LK)),0.),700.)*14.;
  spec+=vec3(.6,.75,1.)*pow(max(dot(rr,normalize(LF)),0.),500.)*5.;
  vec3 dcol=refl*F+tr*(1.-F)+spec;
  col=mix(bg,dcol,cov);
 }
 col=aces(col*1.15);
 col=pow(col,vec3(1./2.2));
 col+=(h13(vec3(gl_FragCoord.xy,uT))-.5)/255.;
 o=vec4(col,1.);
}
</script>
<script>
(function(){
'use strict';
var cv=document.getElementById('c');
var gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){document.getElementById('l').textContent='webgl2 unavailable';return;}
function sh(t,s){var o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));}return o;}
var pr=gl.createProgram();
gl.attachShader(pr,sh(gl.VERTEX_SHADER,document.getElementById('vs').textContent.trim()));
gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,document.getElementById('fs').textContent.trim()));
gl.linkProgram(pr);
if(!gl.getProgramParameter(pr,gl.LINK_STATUS)){console.error(gl.getProgramInfoLog(pr));}
gl.useProgram(pr);
var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
var loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
var U={};['uRes','uC','uR','uA','uR0','uR1','uR2','uT'].forEach(function(n){U[n]=gl.getUniformLocation(pr,n);});

var qs=new URLSearchParams(location.search);
var fixed=parseFloat(qs.get('s'));
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var MS=reduce?0.35:1;
var scale=1,W=0,H=0,dpr=1;
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);
 var cw=innerWidth,ch=innerHeight;
 var budget=2.6e6; // px at scale 1
 var s0=Math.min(1,Math.sqrt(budget/(cw*ch*dpr*dpr)));
 if(!isNaN(fixed))scale=fixed;else if(!resize.done){scale=s0;}
 resize.done=1;
 var k=dpr*scale;
 W=Math.max(2,Math.round(cw*k));H=Math.max(2,Math.round(ch*k));
 cv.width=W;cv.height=H;gl.viewport(0,0,W,H);
}
addEventListener('resize',resize);resize();

// ---- physics ----
var D=4,FL=0.75,R=1.12;
var pos=[0,0,0],vel=[0,0,0];
var amp=new Float32Array(8),av=new Float32Array(8);
var om=[1.9,2.1,2.0,2.2,1.85,6.2,6.6,6.0],ze=[.11,.12,.12,.12,.13,.9,.95,1.0];
var rot=[[1,0,0],[0,1,0],[0,0,1]];
function Yc(i,q){var x=q[0],y=q[1],z=q[2],z2=z*z;
 switch(i){case 0:return(3*z2-1)*.5;case 1:return x*z*2;case 2:return x*x-y*y;case 3:return x*y*2;case 4:return y*z*2;
 case 5:return z*(5*z2-3)*.5;case 6:return x*(5*z2-1)*.8;default:return y*(5*z2-1)*.8;}}
function kick(dir,s){ // dir in world, excite modes by harmonic projection
 var q=[rot[0][0]*dir[0]+rot[0][1]*dir[1]+rot[0][2]*dir[2],
        rot[1][0]*dir[0]+rot[1][1]*dir[1]+rot[1][2]*dir[2],
        rot[2][0]*dir[0]+rot[2][1]*dir[1]+rot[2][2]*dir[2]];
 for(var i=0;i<8;i++)av[i]+=Yc(i,q)*s*(i<5?1:.6);
}
function rnd(a,b){return a+Math.random()*(b-a);}
var nextExc=1.2;
// pointer
var ptr={x:0,y:0,px:0,py:0,down:false,on:false,vx:0,vy:0,t:0};
function toWorld(e){
 var r=cv.getBoundingClientRect();
 var m=Math.min(r.width,r.height);
 var ux=(e.clientX-r.left-r.width/2)/m,uy=-(e.clientY-r.top-r.height/2)/m;
 return [ux*D/FL,uy*D/FL];
}
function pmove(e){
 var w=toWorld(e);var now=performance.now();
 if(ptr.on){var dt=Math.max((now-ptr.t)/1000,1/240);ptr.vx=(w[0]-ptr.x)/dt;ptr.vy=(w[1]-ptr.y)/dt;}
 ptr.x=w[0];ptr.y=w[1];ptr.t=now;ptr.on=true;
 if(e.pointerType==='touch'&&!ptr.down)ptr.on=false;
}
cv.addEventListener('pointerdown',function(e){ptr.down=true;ptr.on=false;pmove(e);cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';
 // tap = poke
 var dx=ptr.x-pos[0],dy=ptr.y-pos[1],d=Math.hypot(dx,dy);
 if(d<R*1.4){var n=[dx/(d+1e-3),dy/(d+1e-3),0];kick([n[0],n[1],.3],1.1*MS);vel[0]-=n[0]*.5*MS;vel[1]-=n[1]*.5*MS;}
});
addEventListener('pointerup',function(e){ptr.down=false;cv.style.cursor='grab';if(e.pointerType==='touch')ptr.on=false;});
cv.addEventListener('pointermove',pmove);
cv.addEventListener('pointerleave',function(){ptr.on=false;});
cv.addEventListener('contextmenu',function(e){e.preventDefault();});

function step(dt,t){
 // drift: slow lissajous target + spring
 var tx=Math.sin(t*.17)*.45*MS,ty=Math.sin(t*.13+1.)*.3*MS,tz=Math.sin(t*.11)*.25*MS;
 var k=1.6,c=1.2;
 var f=[(tx-pos[0])*k-vel[0]*c,(ty-pos[1])*k-vel[1]*c,(tz-pos[2])*k-vel[2]*c];
 // pointer interaction
 if(ptr.on||ptr.down){
  var dx=pos[0]-ptr.x,dy=pos[1]-ptr.y,d=Math.hypot(dx,dy);
  var reach=R*1.25;
  if(d<reach){
   var w=1-d/reach;w*=w;
   var sp=Math.hypot(ptr.vx,ptr.vy);
   var nx=dx/(d+1e-3),ny=dy/(d+1e-3);
   // push along pointer motion plus gentle repulsion
   var push=Math.min(sp,14)*w;
   f[0]+=(ptr.vx*.5+nx*3)*w*MS;f[1]+=(ptr.vy*.5+ny*3)*w*MS;
   // excite: strongest on side of contact
   if(sp>.2)kick([-nx,-ny,0],push*dt*3.2*MS);
   if(ptr.down){f[0]+=(ptr.x-pos[0])*2.2;f[1]+=(ptr.y-pos[1])*2.2;}
  }
  ptr.vx*=.9;ptr.vy*=.9;
 }
 for(var i=0;i<3;i++){vel[i]+=f[i]*dt;pos[i]+=vel[i]*dt;}
 // keep on screen-ish
 var lim=1.6;pos[0]=Math.max(-lim*1.5,Math.min(lim*1.5,pos[0]));pos[1]=Math.max(-lim,Math.min(lim,pos[1]));
 // mode oscillators (damped), clamp total
 var tot=0;
 for(var j=0;j<8;j++){
  var a=-om[j]*om[j]*amp[j]-2*ze[j]*om[j]*av[j];
  av[j]+=a*dt;amp[j]+=av[j]*dt;
  amp[j]=Math.max(-1.6,Math.min(1.6,amp[j]));tot+=Math.abs(amp[j]);
 }
 // re-excitation: soft random impulses so it never settles
 nextExc-=dt;
 if(nextExc<=0){
  nextExc=rnd(1.1,2.6);
  var a=Math.random()*6.283,b=Math.acos(rnd(-1,1));
  kick([Math.sin(b)*Math.cos(a),Math.sin(b)*Math.sin(a),Math.cos(b)],rnd(.5,1.0)*MS);
 }
 // gentle continuous drive to keep l=2 alive
 av[0]+=Math.sin(t*1.3)*.35*dt*MS;av[2]+=Math.cos(t*1.7)*.3*dt*MS;av[3]+=Math.sin(t*1.1+2)*.3*dt*MS;
 // rotation: slow, about tilted axis
 var th=t*.09*MS,ax=[.3,1,.2],al=Math.hypot(ax[0],ax[1],ax[2]);ax=[ax[0]/al,ax[1]/al,ax[2]/al];
 var cs=Math.cos(th),sn=Math.sin(th),oc=1-cs;
 rot=[[cs+ax[0]*ax[0]*oc,ax[0]*ax[1]*oc-ax[2]*sn,ax[0]*ax[2]*oc+ax[1]*sn],
      [ax[1]*ax[0]*oc+ax[2]*sn,cs+ax[1]*ax[1]*oc,ax[1]*ax[2]*oc-ax[0]*sn],
      [ax[2]*ax[0]*oc-ax[1]*sn,ax[2]*ax[1]*oc+ax[0]*sn,cs+ax[2]*ax[2]*oc]];
}
// initial kick so first frames already wobble
kick([1,.3,.4],1.2);kick([-.2,1,.2],.9);
for(var w0=0;w0<60;w0++)step(1/60,w0/60);

var last=performance.now(),t=0,acc=0,cnt=0,cool=0;
function frame(now){
 var rdt=Math.min((now-last)/1000,.05);last=now;
 // fixed substeps
 var rem=rdt;while(rem>0){var h=Math.min(rem,1/120);t+=h;step(h,t);rem-=h;}
 // adaptive resolution
 if(isNaN(fixed)){
  acc+=rdt;cnt++;cool--;
  if(cnt>=24){
   var avg=acc/cnt;acc=0;cnt=0;
   if(avg>.019&&scale>.35&&cool<=0){scale=Math.max(.35,scale*Math.sqrt(.0166/avg)*.97);resize();cool=2;}
   else if(avg<.0125&&cool<=0){var smax=Math.min(1,Math.sqrt(2.6e6/(innerWidth*innerHeight*dpr*dpr))*1.15);if(scale<smax){scale=Math.min(smax,scale*1.07);resize();cool=6;}}
  }
 }
 gl.uniform2f(U.uRes,W,H);
 gl.uniform3f(U.uC,pos[0],pos[1],pos[2]);
 gl.uniform1f(U.uR,R);
 gl.uniform1fv(U.uA,amp);
 gl.uniform3f(U.uR0,rot[0][0],rot[0][1],rot[0][2]);
 gl.uniform3f(U.uR1,rot[1][0],rot[1][1],rot[1][2]);
 gl.uniform3f(U.uR2,rot[2][0],rot[2][1],rot[2][2]);
 gl.uniform1f(U.uT,t%100);
 gl.drawArrays(gl.TRIANGLES,0,3);
 requestAnimationFrame(frame);
}
// radius sized to ~36% of min viewport dimension
(function(){var cam=D;var tanA=1/Math.sqrt(cam*cam-1);})();
requestAnimationFrame(frame);
window.__droplet={get scale(){return scale;}};
})();
</script>
</body>
</html>
